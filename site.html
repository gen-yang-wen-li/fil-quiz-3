<!DOCTYPE html>

<head>

    <title>Kasaysayan ng Pilipinas Quiz & Project History</title>

    <!-- Quiz Data (Philippine History) -->
    <!-- Question 1 (Slide 3 & 4) -->
    <meta name="quiz-data"
          data-page="1"
          data-question="Ano ang pangunahing layunin ng Treaty of Paris sa Pilipinas?"
          data-choices="Isalin ang pamamahala sa Espanya,Isuko ang sovereignty ng Espanya sa Estados Unidos,Ibalik ang pamamahala sa mga Pilipino,Lumikha ng bagong pamahalaang militar sa Pilipinas"
          data-answer="Isuko ang sovereignty ng Espanya sa Estados Unidos"
          data-explanation="Sa Treaty of Paris, pormal na isinuko ng Espanya ang sovereignty sa Pilipinas sa Estados Unidos kapalit ng 20 milyong dolyar, na nagtapos sa pamamahala ng Espanya at nagpasimula ng pamamahala ng Estados Unidos.">

    <!-- Question 2 (Slide 6 & 7) -->
    <meta name="quiz-data"
          data-page="2"
          data-question="Bakit itinuturing ng mga rebolusyonaryong Pilipino ang pagdating ng Estados Unidos na Biayaya?"
          data-choices="Dahil tutulungan silang lumaban sa mga Espanyol,Dahil magbibigay sila ng pondo sa pamahalaan,Dahil magtatayo sila ng mga paaralan,Dahil sa kanilang mabilis na pag-unlad ng ekonomiya"
          data-answer="Dahil tutulungan silang lumaban sa mga Espanyol"
          data-explanation="Inakala ng mga rebolusyonaryong Pilipino na ang pagtataguyod ng Estados Unidos ay upang tulungan silang lumaban sa Espanya, kaya itinuring nila itong isang biyaya.">

    <!-- Question 3 (Slide 9 & 10) -->
    <meta name="quiz-data"
          data-page="3"
          data-question="Bakit totoong nagkaroon ng Hidwaan si Emilio Aguinaldo?"
          data-choices="Dahil sa magkakaibang pananaw sa pamamahala at kasarinlan,Dahil sa away sa teritoryo sa ibang rehiyon,Dahil sa hindi pagkakasundo sa pagpili ng wika,Dahil sa kawalan ng pondo ng pamahalaan"
          data-answer="Dahil sa magkakaibang pananaw sa pamamahala at kasarinlan"
          data-explanation="Ang hidwaan ay nag-ugat sa magkakaibang pananaw hinggil sa tunay na motibo ng Estados Unidos sa Pilipinas at sa pangkalahatang direksyon ng pamahalaang rebolusyonaryo.">

    <!-- Question 4 (Slide 12 & 13) -->
    <meta name="quiz-data"
          data-page="4"
          data-question="Ano ang pangunahing layunin ng pormal na pagpasa ng Jones Law?"
          data-choices="Ibigay ang ganap na kalayaan ng Pilipinas agad-agad,Magtatag ng pamahalaang mag-aakay sa Pilipinas tungo sa kalayaan,Palakasin ang militar ng Espanya sa Pilipinas,Ipagbawal ang partisipasyon ng mga Pilipino sa gobyerno"
          data-answer="Magtatag ng pamahalaang mag-aakay sa Pilipinas tungo sa kalayaan"
          data-explanation="Ipinangako ng Jones Law ang pagkakaloob ng kalayaan sa Pilipinas sa sandaling magkaroon ito ng isang matatag na pamahalaan.">

    <!-- Question 5 (Slide 15 & 16) -->
    <meta name="quiz-data"
          data-page="5"
          data-question="Ano ang pangunahing layunin ng Tydings-McDuffie Act?"
          data-choices="Mag-alok ng tulong pananalapi sa Pilipinas,Pagtatag ng sampung taong transisyon bago ang kalayaan,Pagbabawal sa kalakalan sa ibang bansa,Pagpapalawak ng teritoryo ng Estados Unidos"
          data-answer="Pagtatag ng sampung taong transisyon bago ang kalayaan"
          data-explanation="Ang Tydings-McDuffie Act ay nagtadhana ng sampung taong transisyon (Commonwealth) bago ang ganap na pagkilala sa kalayaan ng Pilipinas.">

    <!-- Question 6 (Slide 18 & 19) -->
    <meta name="quiz-data"
          data-page="6"
          data-question="Ano ang masamang epekto ng malayang kalakalan sa pamamahala ng mga Amerikano sa Pilipinas ayon sa mga kritiko?"
          data-choices="Paghina ng kultura ng Bansa,Pagsandal ng ekonomiya ng Pilipinas sa Estados Unidos,Pagbaba ng antas ng edukasyon,Pagkawala ng mga tradisyunal na sining"
          data-answer="Pagsandal ng ekonomiya ng Pilipinas sa Estados Unidos"
          data-explanation="Ang malayang kalakalan ay nagdulot ng labis na pagdepende ng ekonomiya ng Pilipinas sa pamilihan at produkto ng Estados Unidos.">

    <!-- Question 7 (Slide 21 & 22) -->
    <meta name="quiz-data"
          data-page="7"
          data-question="Ano ang kahalagahan ng pagbabalik sa Leyte ni Douglas MacArthur sa Leyte?"
          data-choices="Umapela ng tulong militar sa mga Hapon,Simula ng pagpapalalaya sa Pilipinas mula sa mga Hapon,Pagpapatibay ng kasunduan sa Espanya,Pagbabalik ng pamahalaang Espanyol"
          data-answer="Simula ng pagpapalalaya sa Pilipinas mula sa mga Hapon"
          data-explanation="Ang pagdaong sa Red Beach, Palo, Leyte ay naghudyat ng pagsisimula ng kampanya para mapalaya ang Pilipinas mula sa okupasyon ng mga Hapon.">

    <!-- Question 8 (Slide 24 & 25) -->
    <meta name="quiz-data"
          data-page="8"
          data-question="Ano ang isa sa mga pangunahing uri ng probisyon ng Bell Trade Act?"
          data-choices="Pagpapalawak ng teritoryo ng Estados Unidos,Pagpapanatili ng malayang kalakalan sa pagitan ng US at Pilipinas,Pagbibigay ng tulong militar sa ibang bansa,Pagtatag ng panibagong sistema ng edukasyon"
          data-answer="Pagpapanatili ng malayang kalakalan sa pagitan ng US at Pilipinas"
          data-explanation="Ang pagpapatibay ng Bell Trade Act ay nagpatuloy ng probisyon ng malayang kalakalan at parity rights na nagbigay ng pantay na karapatan sa mga Amerikano sa likas na yaman ng Pilipinas.">

    <!-- Question 9 (Slide 27 & 28) -->
    <meta name="quiz-data"
          data-page="9"
          data-question="Ano ang pangunahing layunin sa pagpapatupad ng Bell Trade Act noong Commonwealth?"
          data-choices="Mabilis na pagsasaayos ng ekonomiya ng Pilipinas,Pagpapalakas ng pwersang militar sa Asya,Pagbibigay ng tulong pinansyal sa mga magsasaka,Paghahanda ng bansa para sa bagong digmaan"
          data-answer="Mabilis na pagsasaayos ng ekonomiya ng Pilipinas"
          data-explanation="Ang Bell Trade Act ay itinaguyod upang mabilis na maipatupad ang rehabilitasyon at pagsasaayos ng ekonomiya ng Pilipinas pagkatapos ng Ikalawang Digmaang Pandaigdig.">

    <!-- Question 10 (Slide 30 & 31) -->
    <meta name="quiz-data"
          data-page="10"
          data-question="Ano ang pangunahing layunin ng mga programa sa panahon ng pamamahala ni Manuel Roxas?"
          data-choices="Ipagpatuloy ang lumang sistema ng edukasyon,Pagsasaayos ng ekonomiya at rehabilitasyon ng bansa,Pagpapalawak ng teritoryo ng bansa,Ibalik ang pambansang kontrol sa pananalapi"
          data-answer="Pagsasaayos ng ekonomiya at rehabilitasyon ng bansa"
          data-explanation="Ang pangunahing prayoridad ng panunungkulan ni Roxas ay ang muling pagtatag at rehabilitasyon ng bansa mula sa pinsalang dulot ng digmaan.">

    <!-- Question 11 (Slide 33 & 34) -->
    <meta name="quiz-data"
          data-page="11"
          data-question="Ano ang layunin ng Parity Rights sa panahon ng panunungkulan ni Roxas?"
          data-choices="Magbigay ng pantay na karapatan sa mga Amerikano sa likas na yaman,Pagtatag ng sariling kumpanya ng mga Pilipino,Pagbabawal sa mga dayuhang negosyante,Paghahati ng lupain sa mga magsasaka"
          data-answer="Magbigay ng pantay na karapatan sa mga Amerikano sa likas na yaman"
          data-explanation="Ang Parity Rights ay nagbigay ng pantay na karapatan sa mga mamamayan at korporasyong Amerikano na linangin at gamitin ang mga likas na yaman ng Pilipinas.">

    <!-- Question 12 (Slide 36 & 37) -->
    <meta name="quiz-data"
          data-page="12"
          data-question="Ano ang pangunahing tungkulin ng National Economic Council?"
          data-choices="Pamamahala sa edukasyon ng bansa,Pagsuri sa mga patakarang pangkabuhayan ng bansa,Pagpapalakas ng pwersang militar,Pangangalaga sa kapaligiran"
          data-answer="Pagsuri sa mga patakarang pangkabuhayan ng bansa"
          data-explanation="Ang National Economic Council ay binuo upang magplano, magrekomenda, at maglinang ng mga programang pangkabuhayan sa pagsasaayos ng ekonomiya.">

    <!-- Question 13 (Slide 39 & 40) -->
    <meta name="quiz-data"
          data-page="13"
          data-question="Ano ang tamang pahayag hinggil sa Batas sa Patakarang 'Filipino First'?"
          data-choices="Tama,Mali,Siguro,Depende"
          data-answer="Tama"
          data-explanation="Tumpak ang pahayag dahil ang patakarang 'Filipino First' ay naglayong bigyang-priyoridad ang mga mamamayang Pilipino sa ekonomiya at negosyo ng bansa.">

    <!-- Question 14 (Slide 42 & 43) -->
    <meta name="quiz-data"
          data-page="14"
          data-question="Ano ang naging mahalagang naging kontribusyon ng pamamahala ni Diosdado Macapagal?"
          data-choices="Pagtatag ng bagong sistema ng edukasyon,Paglipat ng Araw ng Kalayaan mula Hulyo 4 tungong Hunyo 12,Pagpapatayo ng mga pangunahing daan,Pagpapalawak ng teritoryo ng bansa"
          data-answer="Paglipat ng Araw ng Kalayaan mula Hulyo 4 tungong Hunyo 12"
          data-explanation="Ang paglipat ng Araw ng Kalayaan mula Hulyo 4 tungong Hunyo 12 ay nagpakita ng tunay na pagkilala sa deklarasyon ng kalayaan sa Kawit, Cavite noong 1898.">

    <!-- Question 15 (Slide 45 & 46) -->
    <meta name="quiz-data"
          data-page="15"
          data-question="Ano ang pangunahing layunin ng Agricultural Land Reform Code?"
          data-choices="Magbigay ng tulong sa mga mangingisda,Paghahati ng mga malalaking lupain para sa mga magsasaka,Pagpapatayo ng mga pabrika sa nayon,Pagpapalawak ng imprastraktura sa lungsod"
          data-answer="Paghahati ng mga malalaking lupain para sa mga magsasaka"
          data-explanation="Ang Agricultural Land Reform Code ay naglayong alisin ang sistemang kasama (tenancy) at ipamahagi ang lupang sakahan sa mga tunay na nagbubungkal nito.">

    <style>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const canvaPage = document.getElementById("page-canva");
            const homePage = document.getElementById("page-home");
            const quizPage = document.getElementById("page-quiz");
            const toQuizHomeBtn = document.getElementById("to-quiz-home");
            const toCanvaPageBtn = document.getElementById("to-canva-page");

            const quizPageTitle = document.getElementById("quiz-page-title");
            const quizQuestionEl = document.getElementById("quiz-question");
            const choicesGrid = document.getElementById("choices-grid");
            const quizFeedback = document.getElementById("quiz-feedback");
            const quizExplanationEl = document.getElementById("quiz-explanation");
            const backBtn = document.getElementById("back-to-home");

            // Page switching handlers
            toQuizHomeBtn.addEventListener("click", () => {
                canvaPage.classList.remove("active");
                homePage.classList.add("active");
            });

            toCanvaPageBtn.addEventListener("click", () => {
                homePage.classList.remove("active");
                canvaPage.classList.add("active");
            });

            const boxes = document.querySelectorAll(".grid-box[data-page]");

            boxes.forEach(box => {
                box.addEventListener("click", () => {
                    const pageNum = box.getAttribute("data-page");
                    
                    // Find corresponding custom meta tag in the head
                    const metaTag = document.querySelector(`meta[name="quiz-data"][data-page="${pageNum}"]`);
                    if (!metaTag) return;

                    const question = metaTag.getAttribute("data-question");
                    const choices = metaTag.getAttribute("data-choices").split(",");
                    const correctAnswer = metaTag.getAttribute("data-answer");
                    const explanation = metaTag.getAttribute("data-explanation");

                    // Populate quiz page
                    quizPageTitle.textContent = `Tanong ${pageNum} ng 15`;
                    quizQuestionEl.textContent = question;
                    quizFeedback.textContent = "";
                    quizExplanationEl.textContent = "";

                    // Clear previous choices
                    choicesGrid.innerHTML = "";

                    // Render choice boxes
                    choices.forEach(choice => {
                        const choiceBox = document.createElement("div");
                        choiceBox.className = "choice-box";
                        choiceBox.textContent = choice;

                        choiceBox.addEventListener("click", () => {
                            // Disable further clicks on choices for this round
                            const allChoices = choicesGrid.querySelectorAll(".choice-box");
                            allChoices.forEach(cb => cb.style.pointerEvents = "none");

                            if (choice.trim() === correctAnswer.trim()) {
                                choiceBox.classList.add("correct");
                                quizFeedback.textContent = "Tama! 🎉";
                                quizFeedback.style.color = "#4ade80";
                                quizExplanationEl.textContent = explanation;
                            } else {
                                choiceBox.classList.add("incorrect");
                                quizFeedback.textContent = `Mali. Tamang sagot: ${correctAnswer}`;
                                quizFeedback.style.color = "#f87171";
                                quizExplanationEl.textContent = explanation;

                                // Highlight correct one
                                allChoices.forEach(cb => {
                                    if (cb.textContent.trim() === correctAnswer.trim()) {
                                        cb.classList.add("correct");
                                    }
                                });
                            }
                        });

                        choicesGrid.appendChild(choiceBox);
                    });

                    // Switch to quiz page
                    homePage.classList.remove("active");
                    quizPage.classList.add("active");
                });
            });

            backBtn.addEventListener("click", () => {
                quizPage.classList.remove("active");
                homePage.classList.add("active");
            });
        });
    </script>
</body>
</html>
